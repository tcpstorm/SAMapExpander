; MapExpander configuration. Place next to MapExpander.SA.asi.
;
; Every section other than [World] defines one custom map region. Add as many as you like.
;
; [World] Gxt loads whole GXT files (a region's american.gxt, III/VC or SA format) into the game's
; text lookup. The importer namespaces their keys, so they add to San Andreas' strings; an untagged
; file replaces them, and the log says so key by key.
;
; Tiles are addressed in the region's OWN coordinate system (the same one its original
; radar used), and WorldOrigin says where that map's (0,0) sits in San Andreas.
;
;   TileFolder    folder with the tile images, relative to the game directory (PNG)
;   FilePattern   file name; two %d = column,row (zero-based, column west->east, row north->south)
;                 one %d  = row-major index (row * TilesX + column), like SA's radar00..radar143
;   TileSize      world units per tile (SA/VC/III radar tiles are 500)
;   TilesX/Y      grid size
;   GridMinX      local X of the west edge of column 0   (default: -TilesX*TileSize/2)
;   GridMaxY      local Y of the north edge of row 0     (default: +TilesY*TileSize/2)
;   WorldOriginX/Y   SA world position of the region's local (0,0)
;   WorldMinX/MaxX/MinY/MaxY   alternative: extent in SA space; origin = its centre
;   WorldOriginZ  height added to everything the region loads (water levels, zone boxes, every
;                 IPL coordinate, inst placements) when the
;                 map itself was placed higher or lower than in its own game (default 0)
;   Water         water map for this region, relative to the game directory. Either a SA-format
;                 text water.dat (its coordinates are region-local and get the origin added) or a
;                 III/VC binary waterpro.dat (converted to flat quads; tools/waterpro_to_dat.py
;                 does the same conversion offline if you want to inspect or edit the result).
;   WaterXOffset  waterpro.dat only: the source game's WATER_X_OFFSET. 400 for Vice City, 0 for
;                 GTA III. Vice City's own water lookup shifts X by this much before indexing.
;   Img           comma-separated IMG archives (SA IMG version 2) holding the region's .dff/.txd.
;                 Registered with the streamer before it scans any archive directory. San Andreas
;                 has 8 archive slots and uses 3, so at most 5 region archives can be added.
;   Ide           comma-separated .ide files. objs/tobj/anim/txdp are loaded through the game's own
;                 IDE parser with the model ids remapped into the free range below; peds, cars,
;                 weap, hier, path and 2dfx sections are ignored.
;   Ipl           comma-separated .ipl files. This module reads only their inst section: each
;                 placement gets its model id remapped and the region origin added to x and y.
;   Col           comma-separated loose .col files (not inside an IMG). Loaded once at start-up
;                 into collision slot 0, which San Andreas never streams out, so a region's
;                 collision is permanently in memory.
;   Names         the importer's names.txt (new name, original name, why). Optional; with it the
;                 log names a model in the source game's terms rather than by id.
;   ObjectData    a San Andreas format object.dat for this region's models, written by the
;                 importer from the source game's own. Every model named in it is placed as a
;                 dynamic object instead of a building, which is what makes glass breakable and
;                 props smashable and pushable; a model with no line here is scenery and can
;                 never react to anything. Loaded after San Andreas' own DATA\OBJECT.DAT into
;                 the same fixed table, which the plugin grows to fit if the regions need it.
;
; Water beyond the vanilla +/-3000 map drives physics (swimming, boats, buoyancy, the underwater
; camera) and, with ExtendWaterRendering, is also drawn: inside the area a region's water map covers,
; SA's flat endless ocean at z = 0 is replaced by the region's own levels, and cells the map says are
; dry stay dry. Everything is drawn by the game's own water rectangle renderer, so it keeps SA's
; textures, waves, fog and draw distance.
;
;   Ipl           item placement file(s) to load with WorldOrigin added to every coordinate,
;                 relative to the game directory; comma-separated for more than one. An entry
;                 with * or ? in the file name expands to every match, in name order (this goes
;                 for every file list below).
;                 Handled sections: cull enex tcyc jump pick cars grge auzo, and inst when the
;                 region has Img/Ide (see below). Ignored (counted in the log): zone, occl, path,
;                 mult.
;                 The game's arrays are small - cull 1300 (+40 tunnel, +72 mirror), enex 400,
;                 tcyc 20, jump 256, grge 50, auzo 158 boxes + 3 spheres - and vanilla SA already
;                 fills much of them; MapExpander.log reports how much room was left.
;                 pick/cars positions are limited by CompressedPositionScale below, auzo boxes to
;                 a fixed +/-4096; lines outside those are logged and skipped.
;   Zones         area name boxes for this region, in the region's own coordinates: the map's
;                 original info.zon / IPL "zone" lines. Several files, separated by commas.
;   ZoneNames     display names for the GXT keys those lines use, one "KEY = Name" per line
;                 (or "KEY Name"). Keys not listed get the key itself, title-cased.
;   Weapons       the importer's weapons.dat: the guns the source game had and San Andreas does
;                 not. Column A is "NEWNAME/SAWEAPON" - the name the new gun answers to, and the
;                 San Andreas weapon it is paired with - or just "SAWEAPON", in which case the new
;                 name is made up from the mesh (v_python becomes PYTHON). What that pairing means
;                 depends on RegionWeaponMode below: under Add it is only a donor whose behaviour
;                 and unstated columns the new gun borrows, under Replace the new gun is written
;                 over it. The rest of the columns are: fire type, target range, weapon range,
;                 model name, model2, slot, animation group, clip, damage, fire offset x/y/z, hex
;                 flags, and for a projectile speed, radius, lifespan, spread. A column of "*"
;                 keeps what was already there - the donor's under Add, San Andreas' under Replace
;                 - which is what the importer writes wherever the source game has no column; the
;                 animation numbers in particular address San Andreas' own animations, not the
;                 source game's. Ignored under SA-MP, where the server owns what every weapon is.
;   Pickups       the importer's pickups.dat: the weapons, health, armour and money the source
;                 game's main script left lying around its map, in the region's own coordinates.
;                 Columns: kind, what, pickup type, ammo, x, y, z. Kind "weapon" names a San
;                 Andreas weapon type and the pickup shows whatever model that weapon has, so it
;                 follows the Weapons file above; kind "model" names a San Andreas model id, for
;                 health, armour, money and the rest. Pickup type 2 is the ordinary one that comes
;                 back after a while. Ignored under SA-MP, where the server places the pickups.
;   PedNodes      the importer's pednodes.dat: the source game's own pedestrian path graph, in the
;                 region's own coordinates. One node per line - x y z district, then the nodes it
;                 is joined to - which is where somebody may stand and where they may walk next.
;                 San Andreas cannot hold these itself: a path node position is an int16 times
;                 0.125 and reaches only +/-4095.875, and a region beyond that is why nothing
;                 spawns there at all. The plugin keeps the graph in its own memory instead and
;                 walks pedestrians along it, leaving San Andreas' own path graph untouched.
;   PedGroups     the importer's pedgrp.dat: who walks where. "zone" lines give each of the source
;                 game's districts a daytime and a night-time group, and "group" lines list that
;                 group's people as DONOR/SAMODEL pairs - what the source game asked for, and the
;                 San Andreas model standing in for it until the source's own peds are imported.
;                 Change the right-hand side and the crowd changes; nothing in the plugin has to.
;   CarNodes      the importer's carnodes.dat: the source game's carriageways, in the same shape as
;                 PedNodes with four columns more - the width of the central reservation and how
;                 many lanes run each way, which is what its own traffic drove by. Read only when
;                 [World] RegionPaths is on.
;   ParkedCars    the importer's parkedcars.dat: where the source game's own script parked a car,
;                 in the region's own coordinates. A "fleet" line lists what that game meant by
;                 "any ordinary car" and "car" lines give a position, a heading, the vehicle as a
;                 DONOR/SAMODEL pair and the chance its doors were locked. A z of -100 means "on
;                 the ground here", which is the convention in both donor games and in San Andreas.
;                 All four files are ignored under SA-MP, where the server owns the population.
;   RegionName    area name for the whole tile grid where no zone applies (default: none)
;   ZoneInfoLabel existing SA zone whose population/gang info the region's zones share
;                 (default SAN_AND). SA's 380 zone-info slots are already full, so region zones
;                 cannot get their own.
;   Interior<N>   "area, minX, minY, minZ, maxX, maxY, maxZ [, name]" - one box, in the region's
;                 own coordinates, that means "the player is standing in this interior". Number the
;                 keys Interior1, Interior2, ... (gaps are fine).
;
; Interiors. Vice City and San Andreas hide interiors the same way, because SA inherited the code:
; every entity carries an area code - the third column of an IPL "inst" line - and the game draws
; only entities whose code matches CGame::currArea, or is 13, which both games read as "everywhere".
; Vice City writes real area codes into its own IPLs (1 = Ocean View hotel, 2 = Vercetti estate,
; 4 = North Point Mall, 17 = Malibu Club, and so on to 18), so the column carries across untouched
; and the interiors are already loaded, already placed and already correctly hidden. That is what
; the black rectangles in doorways are: the room behind the opening is switched off. Unlike SA,
; Vice City builds its interiors inside the real buildings at real world coordinates, so nothing has
; to be moved and nothing can be seen from outside - the shell is in the way.
;
; The one piece missing is the switch. Vice City changed the area from its mission script when the
; player crossed a trigger at a door, and that script is not here; VC's data records nothing about
; where its doorways are. Interior<N> is that switch: stand in the box and the area becomes visible
; around you. Inside one, the game shows that area and area 13 and nothing else, which is how both
; games have always done it. Boxes for the same area may be listed more than once, for an interior
; that is not one room (Vercetti's house and its tower). With [World] Debug=1, F8 logs the player's
; region-local position and the volume they are in, which is how you correct a box that is out.

[World]
; Pickups and car generators store positions as int16 * 1/CompressedPositionScale.
; Vanilla scale is 8 (range +/-4096, 0.125 unit steps). 4 gives +/-8192 at 0.25 unit steps,
; 2 gives +/-16384 at 0.5 unit steps. Pickups/car generators in an existing save were stored
; with the scale active when it was saved.
FixPickupPositions        = 1
FixCarGeneratorPositions  = 1
CompressedPositionScale   = 4
; The peds and vehicles a ped can interact with come from CEntityScanner, which clamps its sector
; search into the vanilla +/-3000 grid before wrapping it into the 16x16 repeat-sector array - so
; beyond the map the search range collapses and the scanners come back empty: melee swings hit
; nothing, and ped AI stops noticing other peds and cars. Removing the clamps makes the search
; wrap the same way inserting an entity does. No effect inside the vanilla map.
FixMeleeBeyondMap         = 1
; GXT files whose strings are patched into the game's text, game-relative, comma separated.
; III/VC (16-bit) and SA (8-bit) GXTs are both read; ours win over SA's own american.gxt, and the
; log lists every key that does. Characters SA's font has no glyph for become '?'.
; The files tools/import_city.py writes carry namespaced keys - "V" for Vice City, "L" for GTA III,
; hashed into "V~ZXD4W" where the name is too long for the 7-character field - so a region's text
; is added to San Andreas' rather than put in its place, and two regions no longer collide either.
; Untagged, 1134 of Vice City's 4707 keys and 717 of III's 2649 answered for San Andreas' own, and
; 694 respectively 468 of those said something different: UZI read "Uz-1" instead of "Micro SMG".
; A nonzero "replace the game's text" count in MapExpander.log means a region folder wants
; re-importing. names.txt in each region says what every key was called in the source game.
Gxt                       = MapExpander\vicecity\american.gxt, MapExpander\libertycity\american.gxt
; Log the first 50 keys the game asks for that neither SA nor our files provide. Diagnostic only:
; it hooks CText::Get, which SA-MP and some mods also patch, so leave it off for normal play.
GxtLogMisses              = 0
; Number of DFF model ids. Vanilla is 20000, of which SA itself uses all but about 1370, so a
; converted map with its own objects needs more. Every other resource id (TXD, COL, IPL, DAT, IFP,
; RRR, SCM) moves up by the same amount, and the streaming arrays are reallocated to match, so a
; savegame written with one value cannot be loaded with another. 20000 turns this off; 26400 is
; the ceiling - the streaming lists link their entries with int16 indices, so the 26316 vanilla
; entries plus what this adds have to stay under 32768. Ignored under SA-MP. MapExpander.log
; reports the resulting layout.
;
; This ships at the ceiling because the two regions below want both cities at once: Vice City
; declares 4131 model ids and Liberty City 2909, 7040 together. 25000 frees 6369 (18631..24999),
; which is not enough for the pair; 26400 frees 7769 and leaves 729 spare. Drop it back to 25000
; if you run only one city and want the smaller streaming arrays.
ModelIdLimit              = 26400
; Let the pause-menu map scroll over every region instead of stopping at the vanilla edge.
ExtendPauseMap            = 1
; Extra free scrolling (world units) past the map and all regions, on every side.
PauseMapMargin            = 1500
; Model ids a region's IDE files may claim. San Andreas' own models stop at 18630; the window runs
; from FreeModelIdStart to the last id ModelIdLimit provides (26399 with the limit above, 19999
; with it off). Ids already taken when the plugin looks are skipped, and the regions share the
; window in the order their sections appear, so leave the start where it is unless you know a mod
; has taken ids below it. Set FreeModelIdEnd to cap it.
FreeModelIdStart          = 18631
;FreeModelIdEnd           = 26399
; Capacity of CModelInfo's atomic model-info store. Stock San Andreas fills nearly all 14000, and
; ModelIdLimit grows the store by the same amount it adds ids. Set this only if another limit
; adjuster changed the store.
;AtomicModelInfoLimit     = 14000
; The four pool limits below are all left unset on purpose. Each is raised from what the regions
; actually hold, summed over every region section in this file, so the two cities below are already
; accounted for: 7040 collision models on top of 10150, and 17803 inst lines on top of the entity
; pools. Set one only to pin that pool at a size of your own.
;
; Size of CPools' col model pool. Every collision model in a region's Col files takes an entry on
; top of the ones San Andreas needs for its own map, and the game dereferences a full pool without
; checking, so by default this is raised to the vanilla 10150 plus what the region col files hold.
;ColModelPoolLimit        = 10150
; Size of CPools' building and dummy pools. San Andreas places about 9200 of its 13000 buildings
; from gta.dat and streams the rest of the map into what is left, so a region's entities get their
; own room: both pools are raised by the number of inst lines its IPLs hold. Squeezing a region into
; the vanilla pools instead loses most of it and leaves the streamer nothing, which it does not
; survive. Set these only to pin the pools at sizes of your own.
;BuildingPoolLimit        = 13000
;DummyPoolLimit           = 2500
; Size of CPools' sector pointer-node pool. Every static entity takes one node for each 50-unit
; sector its bounding box covers, and the game writes through a full pool without checking, so this
; is raised alongside the entity pools.
;PtrNodePoolLimit         = 70000
; Size of CTxdStore's dictionary pool: one entry per texture dictionary name, 5000 in vanilla, of
; which San Andreas' own map uses most. AddTxdSlot writes into whatever the pool hands back
; without checking, so a full pool is a crash the moment a region's dictionaries are added; by
; default it is raised to the vanilla 5000 plus every dictionary name in the regions' IDEs.
;TxdPoolLimit             = 5000
; Or fix the scrollable area explicitly (all four required; overrides the margin):
;PauseMapMinX             = -5000
;PauseMapMaxX             = 9000
;PauseMapMinY             = -5000
;PauseMapMaxY             = 5000
; Draw region water beyond +/-3000 instead of SA's flat ocean. 0 keeps the vanilla ocean and leaves
; region water as physics only. (2 = only hide SA's ocean inside the region's water map, 3 = only
; draw the region's water; both exist for narrowing down rendering problems.)
ExtendWaterRendering      = 1
; Master switches for a region's Weapons and Pickups files. RegionWeapons turns the whole weapon
; feature off whatever the region files say; RegionPickups only adds pickups inside the region and
; is safe to leave on. Neither is applied under SA-MP: the server owns the weapon table and the
; pickups there, and a client that changed either on its own would be out of step with everyone.
RegionWeapons             = 1
RegionPickups             = 1
; The people. RegionPeds walks pedestrians on the region's own PedNodes graph, choosing who from
; its PedGroups table, and RegionPolice answers a wanted level there with cops on foot. Both are
; additions only: San Andreas' own population, over San Andreas' own map, is untouched, and neither
; runs under SA-MP.
;
; RegionPedDensity multiplies how many people are about; it stacks with the game's own population
; slider, so turning traffic down in the menu thins these out too. RegionPedRadius is how far from
; the player they live, and 55 is deliberate: San Andreas puts its own peds in a ring roughly 42.5
; to 50.5 units out and removes them again past 65 off screen or 54.5 on it, so a larger radius
; here only makes people the game immediately takes away again.
;
; What the police can and cannot do is worth knowing before you turn it on. Cops on foot, yes, at
; every wanted level, in the numbers CWanted asks for. Patrol cars, roadblocks, the helicopter and
; the SWAT and army responses, no: every one of those is a vehicle placed on a car path node, and a
; region has no path nodes. See docs/known-limitations.md.
RegionPeds                = 1
RegionPedDensity          = 1.0
RegionPedRadius           = 55.0
RegionPolice              = 1
; Traffic in an imported city, driven along the source game's own carriageways out of its CarNodes
; file. The cars are San Andreas' own models for now, the way the pedestrians are its own peds.
;
; This does not go through San Andreas' path system and cannot: a vehicle link is addressed by a
; packed uint16 with a ten-bit index, so there are 1024 of them per path area, and Vice City's roads
; need three times the total capacity of the areas its ground falls into. So the graph is held here
; instead and the cars are put on it - which has a property worth more than fidelity, in that San
; Andreas' own path data is not touched at all and its own traffic cannot regress. The worst this
; can do is drive badly in an imported city.
;
; The game does the driving. A car is created, given a driver, and put on a go-to-coordinates
; mission aimed at a point in its own lane at the far end of the road it is on; San Andreas' vehicle
; AI does the steering, the throttle, the braking and the avoiding, and when the car arrives it is
; handed the next road. Lanes come from the source game's own lane counts, offset to the right of
; the direction of travel by San Andreas' own 5.4-unit lane width - which is what separates the two
; directions onto their own sides of the road without anything having to be told which side the
; city drives on.
;
; RegionTrafficDensity multiplies how many. The number it multiplies is San Andreas' own: the car
; budget popcycle.dat gives for the zone the player is in, which out here is the whole-map SAN_AND
; row. RegionTrafficRadius is how far from the player they live.
RegionTraffic             = 1
RegionTrafficDensity      = 1.0
RegionTrafficRadius       = 90.0
; The cars the imported city had parked at its own kerbs, out of its ParkedCars file: 148 spaces in
; Vice City and 147 in Liberty City, each with the model, heading and lock chance its own script
; gave it. They are the plugin's own spawns, NOT San Andreas car generators, and that is not a
; detail: CTheCarGenerators is a fixed 500-entry save block written by array index with positions
; compressed to int16 * 0.125, which reaches +/-4096 - a region cannot be expressed in it at all,
; and which slot a region's car took would depend on which regions were loaded. San Andreas' own
; 500 generators and its own save block are untouched.
;
; The cars are the game's own models for now, the way the pedestrians and the traffic are; the
; region's parkedcars.dat pairs each of the source game's vehicles with the San Andreas one
; standing in for it, so importing the donor's own cars later is a change to that file.
;
; RegionParkedCarsDensity is a ceiling on how many exist at once rather than a thinning of the
; source game's own spaces - there are rarely more than a handful of them within the radius, so
; where they are is the source game's decision and this is only the safety net. 1.0 is 14.
; RegionParkedCarsRadius is how far from the player a space is worth filling in; a space the camera
; can see is left alone until it is far enough off that a car appearing there is not something the
; eye catches, so nothing pops into shot.
;
; RegionParkedCarsRespawn is how long, in seconds, a space stays empty after the player takes the
; car out of it or destroys it. This is the one behaviour of the donor games' own system that is
; deliberately not reproduced: their generators have a minimum delay of zero and put another car
; in the space the moment you look away. 720 is half a San Andreas day at its normal clock, which
; is long enough that driving off and coming back finds the space still empty and short enough
; that a long session does not leave the city emptier than the game it came from. 0 means a space
; the player empties stays empty for the rest of the session. None of it is written to a save:
; this is a session's memory, and a new game starts with every space full.
;
; They share the vehicle pool with the traffic above, and under pressure the parked cars stop being
; created first - they keep 14 pool slots free where the traffic keeps 6, so a missing car at a
; kerb, which nobody notices, happens before a missing car in the road, which everybody does.
RegionParkedCars          = 1
RegionParkedCarsDensity   = 1.0
RegionParkedCarsRadius    = 110.0
RegionParkedCarsRespawn   = 720.0
; The traffic. San Andreas holds a path node's position as three int16 multiplied by 0.125, so a
; node reaches +/-4095.875 and no further - which is why an imported city had no cars, no patrol
; cars, no roadblocks and no police helicopter. This widens that the way CompressedPositionScale
; widens pickups: the 287 instructions that scale a path coordinate are pointed at a float of our
; own, and the 207 that read the same shared constant for something else - CPickup, CTrainNode,
; CCarGenerator, COccluder, the audio boxes, several render pipelines - go on reading the game's.
; San Andreas' own shipped nodes are rescaled as each area loads, so nothing in data\paths is
; edited and a vanilla install is a vanilla install again the moment this is turned off.
;
; PathNodeScale is int16 units per world unit, the same sense as CompressedPositionScale. Vanilla
; is 8: +/-4096 in steps of 0.125. Leave it at 0 and the smallest power of two that covers the
; world the regions actually make is chosen and logged - 4 for everything this project ships,
; giving +/-8192 in steps of 0.25. Precision is what driving quality is made of, so it takes the
; smallest widening that fits rather than a generous one: 2 would reach +/-16384 but at half-unit
; steps, which is a car's wheel either side of where the lane really is.
;
; The choice comes from the extent of the region SET, not from the order regions load in, so it
; does not move when a region is added, removed or reordered as long as the maps are the same.
; RegionPaths is the other half, and it is the untested one. Widening the scale only removes the
; barrier; a region's roads are not in CPathFind until this puts them there, and putting them there
; means merging its nodes into the path areas its ground falls in - which cannot be checked without
; running the game. Until it has been, it is off, and WidenPathNodes does nothing on its own: the
; scale engages only when there is something to use it for, because changing how San Andreas reads
; its own paths while buying nothing would be strictly worse than leaving it alone.
;
; As shipped there is NOTHING to turn on here: the merge is not written, so RegionPaths = 1 is
; refused with a line in the log rather than quietly enabling the scale on its own. Which means
; that with the plugin as it stands San Andreas' path data is untouched, byte for byte.
RegionPaths               = 0
WidenPathNodes            = 1
PathNodeScale             = 0
; What a region's weapons.dat actually does. This is the one that matters.
;
;   Add       (default, and the one you want) the source game's guns become weapon types of their
;             own, ALONGSIDE San Andreas' forty-seven. The Desert Eagle stays a Desert Eagle and
;             the Python is a new gun that happens to fire down the Desert Eagle's code path. The
;             plugin widens the weapon system to do it: the name table grows from 49 to 80 entries,
;             the ten unused records at the end of aWeaponInfo become types 70..79, and the five
;             switches on weapon type (CWeapon::Fire, its noise, CWeapon::FireInstantHit, the
;             gunshot audio and the reload audio) get longer jump tables so the new type lands in
;             its donor's case instead of the default. Every one of those sites is checked against
;             the exact bytes San Andreas 1.0 US ships before anything is written; if another mod
;             has patched one, nothing at all is changed and the region's guns are left out. Ten
;             new weapons is the hard limit - that is how many free records there are.
;   Replace   the older behaviour, kept because it is what shipped first: each gun is written over
;             the San Andreas weapon nearest to it. THIS CHANGES THAT WEAPON EVERYWHERE, not only
;             inside the region - there is one weapon table and it is global, so the Desert Eagle
;             becomes a Python in Los Santos too. Only use it if Add cannot run on your executable.
;
; The weapon wheel icon comes from the region archive, not from here: San Andreas finds it by
; hashing the weapon model's name and appending "ICON", so the texture has to be called
; <model>icon inside the model's own dictionary. tools/import_city.py writes one for every
; imported weapon, out of the source game's own icon art where there is some and out of the
; paired San Andreas weapon's where there is not. A region folder imported before that existed
; has no such textures and shows no icons until the importer is run again.
;
; What Add still does not fix, all cosmetic: a ped shot with a new gun plays the generic hit and
; death reactions rather than the pistol or shotgun ones, because Events::ComputeDamageResponse
; branches on "weapon type >= 47" into the arm that handles being run over and blown up, and that
; bound cannot be raised without taking those with it - the damage itself is the new gun's own. A
; savegame made while carrying a new gun also expects the mod to still be installed; without it
; that inventory slot holds a weapon the game no longer has a record for.
RegionWeaponMode          = Add
; How many of San Andreas' 620 pickup slots to keep back for its own script. The regions are placed
; when a game starts, before the script asks for its fifty oysters, fifty horseshoes and its own
; street weapons, so without a reserve a large region would take the slots they need and they would
; simply not appear. Lower it to fit more of a region in, knowing what runs out instead; the log
; says how many placements were dropped.
; How many free pickup slots to leave San Andreas' own script once the regions have taken what they
; want, so its fifty oysters, fifty horseshoes and street weapons still have somewhere to go.
;
; San Andreas has 620 pickup slots and its script already holds 551 of them by the time a region is
; placed, which is why this used to be the thing that stopped a region getting in at all. It is not
; any more: the array is moved to a bigger one, sized as 620 + everything the regions ask for + this
; reserve + a little headroom, and a region's pickups are put in the part above San Andreas' own 620
; rather than taken from it. San Andreas keeps every slot it is using, and the save game still holds
; exactly the first 620 entries, so it stays byte for byte what vanilla San Andreas writes - saves
; made before and after this are interchangeable, and a save made here still loads in vanilla.
;
; Raising it therefore costs nothing but a few hundred bytes and gives the script more room; there
; is no longer a reason to lower it. The log says what the array was grown to and what went where.
PickupReserve             = 200
; San Andreas files every static entity into two fixed grids - 120x120 sectors of 50 units and
; 30x30 of 200 for big buildings - both covering exactly +/-3000, and CEntity::Add clamps an
; entity's bounding box into that box first. A region placed further out is therefore filed against
; the edge of the map instead of where it is, and the renderer, the streamer, line of sight and the
; ped scanners all look where it is not: the city loads and leaves a hole in the world. This halves
; the scale each grid converts with, so 120 sectors of 50 units become 120 of 100 and the world
; reaches +/-6000, with the arrays and savegames untouched. A sector then covers four times the
; ground, so entity scans walk longer lists. Only applied when this plugin is the one placing a
; region's buildings - under SA-MP the server owns them and handles distance itself.
ExtendWorldSectors        = 1
; What a region really costs in frames, and the one thing that changes it.
;
; The grid above is a FIXED 120x120 however much ground it covers, so the sector size is the world
; span divided by 120 and the scan cost is the square of that. It cannot be made bigger: the index
; that reaches the sector array is clamped with a three-byte "cmp reg, imm8" at every one of the
; 136 sites that do it, and a sign-extended imm8 stops at 127, so 128 a side is the ceiling - 6.7%
; off the cell, against the 307 a side that San Andreas plus two cities at vanilla's 50 units would
; need. tools\sector_array_sites.txt is the full enumeration and the evidence.
;
; So the span is the lever, and the span is a placement question. PackRegions moves each region up
; against the ground already in use, on whichever of the four sides leaves the world squarest,
; instead of leaving it wherever its region.ini put it. Choosing the side is what earns the most:
; Liberty City off the west coast with Vice City to the east spreads the world 15348 units on one
; axis and 6052 on the other, and the grid is square because one pair of constants serves both, so
; it pays for the wider one twice - 128-unit sectors. The same city to the north sits alongside
; Vice City rather than opposite it: 10500 units a side, 88-unit sectors, 47% of the scan cost, for
; a city exactly as far from Los Santos either way.
;
; Off by default because it moves the maps, and things remember where they were: pickups and parked
; cars saved in a savegame, teleport coordinates, screenshots, and an SA-MP server's idea of where
; the region's buildings are (it is ignored under SA-MP for that reason). The log says what it
; would save whether it is on or off, so the choice can be made on a number.
PackRegions               = 0
; Clear ground packing leaves between a region and whatever it is packed against.
RegionGap                 = 500
; III and Vice City load one district at a time - the loading screen between them is the swap -
; and what stands in for the districts that are not in memory is a LOD: a per-object one whose HD
; sits in a file that is not loaded, or one of the island-sized meshes in islandsf.ipl and
; overview.ipl (IslandLODmainland, IslandLODcomIND and their kin) that deputises for a whole
; district at once, drawn out to 3000 units. San Andreas has no districts and keeps the whole map
; streamed, so the geometry those stand in for is always present and both draw at once - the
; low-poly stand-in sitting inside and through the buildings it was meant to replace. This leaves
; out the ones nothing will ever hide: 14 orphans and 4 island meshes in Vice City, 213 and 5 in
; Liberty City. A LOD an HD claims is kept, because SA hides that one properly. Needs
; LinkRegionLods, which is what works out which LODs have an HD at all.
DropUnlinkedLods          = 1
; Diagnostics, off for normal play. 1 makes MapExpander.log verbose (byte dumps, hook traces,
; per-tile loads, the full GXT override list, water render statistics) and enables F8, which logs
; your SA position, the region-local equivalent and what the game's zone lookups say there.
; Crashes are always logged (exception address, registers, stack), Debug or not.
Debug                     = 0

; Two regions ship as the default: Vice City to the east of San Andreas and Liberty City to the
; west, both outside the vanilla map and clear of each other.
;
;        x  -7350        -3350   -3000            3000   3998.5         7998.5
;           |  Liberty City  |     |  San Andreas   |      |  Vice City   |
;                             350 units             998.5 units
;
; Each city's geometry sits well inside its own tile grid - Liberty City x -6907..-3591, Vice City
; x 3846..7282 - so not one inst line of either lands inside San Andreas' own +/-3000 box.
; ExtendWorldSectors then has to cover -7350..7998.5 with the 120 sectors San Andreas has: 128
; units each, 6.5 times a vanilla sector's ground, and every per-frame scan over a sector walks
; that much more. One city alone is 92 units (Vice City) or 86 (Liberty City); if the pair costs
; too much, comment out a region rather than moving one, because both origins are the ones their
; SA-MP conversions (VC2SAMP, LC2SAMP) already use and the radar tiles are placed to match.
;
; Everything a region owns lives in MapExpander\<region>\ with the source game's own file names;
; tools\import-city.ps1 fills that folder straight from a III/VC install (-Lite for just tiles,
; text, water and zones).

; ---------------------------------------------------------------------------------------------
; Regions are found on their own.
;
; tools\import_city.py writes a complete MapExpander\<region>\region.ini beside every region it
; builds - archives, IDEs, IPLs, collision, names, object data, zones, interiors, the lot - and
; the plugin reads those directly. Import a game, run it, and the city is there; nothing has to
; be copied into this file. That is what makes this installable from a retail copy of the donor
; game without editing anything.
;
; A section here still wins. Write [ViceCity] below and it replaces the discovered one outright,
; which is how you override a single value - copy the key you want to change out of that
; region.ini, and leave the rest to be discovered.
; ---------------------------------------------------------------------------------------------
